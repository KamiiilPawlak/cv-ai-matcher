[project]
name = "cv-ai-matcher"
version = "0.1.0"
description = "AI powered CV matching system using LLMs"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "aiofiles",
    "pdfplumber",
    "pymupdf",
    "pytesseract",
    "pillow",
    "python-magic-bin; sys_platform == 'win32'",
    "python-magic; sys_platform != 'win32'"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest"
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.black]
line-length = 88
target-version = ["py311"]


[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["magic"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
filterwarnings = "ignore::DeprecationWarning"

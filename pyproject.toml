[project]
name = "cv-ai-matcher"
version = "0.1.0"
description = "AI powered CV matching system using LLMs"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydentic",
    "python-dotenv",
    "pdfplumber"
    ]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest"
]


[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I"]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.black]
line-length = 88
target-version = ["py311"]


[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
services:
  api:
    build:
      context: ./backend/app:/code/app
      dockerfile: Dockerfile
    container_name: cv-ai-matcher-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    environment:
      - WATCHFILES_FORCE_POLLING=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
